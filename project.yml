name: Glint
options:
  bundleIdPrefix: com.ctrixin
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle.git
    from: "2.6.4"

targets:
  Glint:
    type: application
    platform: macOS
    sources:
      - path: Glint
        excludes:
          - "**/.DS_Store"
      # Folder references preserve Ghostty's required runtime layout under
      # Contents/Resources.
      - path: GhosttyResources/ghostty
        type: folder
        buildPhase: resources
      - path: GhosttyResources/terminfo
        type: folder
        buildPhase: resources
    resources:
      - Glint/Resources
    settings:
      base:
        PRODUCT_NAME: CtriTerm
        # Keep the Swift module stable so upstream tests and `@testable import Glint`
        # remain valid even though the installed app has a distinct name.
        PRODUCT_MODULE_NAME: Glint
        PRODUCT_BUNDLE_IDENTIFIER: com.ctrixin.glint
        MARKETING_VERSION: 0.1.28-ctrixin.1
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_FILE: Glint/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Glint/Resources/Glint.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: Glint/App/Glint-Bridging-Header.h
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: CTRIXIN_DISTRIBUTION
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        FRAMEWORK_SEARCH_PATHS:
          - "$(SRCROOT)/Vendor"
        OTHER_LDFLAGS:
          - "-framework"
          - "Metal"
          - "-framework"
          - "MetalKit"
          - "-framework"
          - "QuartzCore"
          - "-framework"
          - "CoreText"
          - "-framework"
          - "AppKit"
          - "-framework"
          - "Carbon"
          - "-framework"
          - "IOKit"
          - "-framework"
          - "Security"
          - "-framework"
          - "UserNotifications"
          - "-lc++"
      configs:
        # Dev builds remain distinct from the local release: their defaults
        # and Application Support state cannot corrupt the installed app.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.ctrixin.glint.dev
    dependencies:
      - framework: Vendor/GhosttyKit.xcframework
        embed: false
      - package: Sparkle

  GlintTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: GlintTests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: Glint
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ctrixin.glint.tests
        GENERATE_INFOPLIST_FILE: YES
        # The app target's PRODUCT_NAME is CtriTerm; xcodegen derives the
        # default TEST_HOST from the target *name* (Glint.app) and the test
        # host then can't be found. Point it at the renamed product.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/CtriTerm.app/Contents/MacOS/CtriTerm"
        BUNDLE_LOADER: "$(TEST_HOST)"
